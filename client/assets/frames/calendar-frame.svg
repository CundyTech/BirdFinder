<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 640" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <filter id="calShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- paper backing -->
  <g filter="url(#calShadow)">
    <rect x="20" y="20" width="400" height="600" rx="6" fill="#fdfbf5" stroke="#e2ddce" stroke-width="1.5"/>
  </g>

  <!-- hanger loop -->
  <circle cx="220" cy="14" r="10" fill="none" stroke="#9a9a9a" stroke-width="3"/>

  <!-- spiral binding rings -->
  <g fill="none" stroke="#a8a8a8" stroke-width="2.4">
    <circle cx="60" cy="28" r="7"/>
    <circle cx="89" cy="28" r="7"/>
    <circle cx="118" cy="28" r="7"/>
    <circle cx="147" cy="28" r="7"/>
    <circle cx="176" cy="28" r="7"/>
    <circle cx="205" cy="28" r="7"/>
    <circle cx="234" cy="28" r="7"/>
    <circle cx="263" cy="28" r="7"/>
    <circle cx="292" cy="28" r="7"/>
    <circle cx="321" cy="28" r="7"/>
    <circle cx="350" cy="28" r="7"/>
    <circle cx="379" cy="28" r="7"/>
  </g>

  <!-- photo window: x=40,y=50,w=360,h=270 -->
  <rect x="40" y="50" width="360" height="270" fill="#000000" opacity="0"/>
  <rect x="40" y="50" width="360" height="270" fill="none" stroke="#d8d3c0" stroke-width="1.5"/>

  <!-- divider -->
  <line x1="40" y1="330" x2="400" y2="330" stroke="#e2ddce" stroke-width="1.5"/>

  <!-- weekend shading -->
  <rect x="40" y="355" width="51.43" height="250" fill="#f6d9d9" opacity="0.5"/>
  <rect x="348.57" y="355" width="51.43" height="250" fill="#f6d9d9" opacity="0.5"/>

  <!-- day-of-week headers -->
  <g fill="#8a8578" font-size="13" font-weight="600" text-anchor="middle">
    <text x="65.7" y="345">S</text>
    <text x="117.1" y="345">M</text>
    <text x="168.6" y="345">T</text>
    <text x="220" y="345">W</text>
    <text x="271.4" y="345">T</text>
    <text x="322.9" y="345">F</text>
    <text x="374.3" y="345">S</text>
  </g>

  <!-- grid lines -->
  <g stroke="#e2ddce" stroke-width="1.2">
    <line x1="40" y1="355" x2="400" y2="355"/>
    <line x1="40" y1="405" x2="400" y2="405"/>
    <line x1="40" y1="455" x2="400" y2="455"/>
    <line x1="40" y1="505" x2="400" y2="505"/>
    <line x1="40" y1="555" x2="400" y2="555"/>
    <line x1="40" y1="605" x2="400" y2="605"/>
    <line x1="40" y1="355" x2="40" y2="605"/>
    <line x1="91.43" y1="355" x2="91.43" y2="605"/>
    <line x1="142.86" y1="355" x2="142.86" y2="605"/>
    <line x1="194.29" y1="355" x2="194.29" y2="605"/>
    <line x1="245.71" y1="355" x2="245.71" y2="605"/>
    <line x1="297.14" y1="355" x2="297.14" y2="605"/>
    <line x1="348.57" y1="355" x2="348.57" y2="605"/>
    <line x1="400" y1="355" x2="400" y2="605"/>
  </g>

  <!-- day numbers (generic 31-day month starting Sunday) -->
  <g fill="#4a4740" font-size="15" text-anchor="middle">
    <text x="65.7" y="380">1</text><text x="117.1" y="380">2</text><text x="168.6" y="380">3</text><text x="220" y="380">4</text><text x="271.4" y="380">5</text><text x="322.9" y="380">6</text><text x="374.3" y="380">7</text>
    <text x="65.7" y="430">8</text><text x="117.1" y="430">9</text><text x="168.6" y="430">10</text><text x="220" y="430">11</text><text x="271.4" y="430">12</text><text x="322.9" y="430">13</text><text x="374.3" y="430">14</text>
    <text x="65.7" y="480">15</text><text x="117.1" y="480">16</text><text x="168.6" y="480">17</text><text x="220" y="480">18</text><text x="271.4" y="480">19</text><text x="322.9" y="480">20</text><text x="374.3" y="480">21</text>
    <text x="65.7" y="530">22</text><text x="117.1" y="530">23</text><text x="168.6" y="530">24</text><text x="220" y="530">25</text><text x="271.4" y="530">26</text><text x="322.9" y="530">27</text><text x="374.3" y="530">28</text>
    <text x="65.7" y="580">29</text><text x="117.1" y="580">30</text><text x="168.6" y="580">31</text>
  </g>
</svg>
