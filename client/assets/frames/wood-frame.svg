<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 540">
  <defs>
    <pattern id="woodGrain" width="80" height="50" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="80" height="50" fill="#a9713f"/>
      <path d="M0,6 C20,3 40,9 60,5 C70,3 75,7 80,5" stroke="#7a4d26" stroke-width="1.6" fill="none" opacity="0.6"/>
      <path d="M0,14 C25,17 45,11 80,15" stroke="#c68a52" stroke-width="1.4" fill="none" opacity="0.55"/>
      <path d="M0,22 C15,19 35,25 55,21 C65,19 72,23 80,20" stroke="#7a4d26" stroke-width="2" fill="none" opacity="0.65"/>
      <path d="M0,31 C20,34 50,28 80,32" stroke="#8a5a34" stroke-width="1.5" fill="none" opacity="0.55"/>
      <path d="M0,39 C22,36 42,42 80,38" stroke="#c68a52" stroke-width="1.4" fill="none" opacity="0.5"/>
      <path d="M0,45 C25,43 55,47 80,44" stroke="#7a4d26" stroke-width="1.6" fill="none" opacity="0.6"/>
    </pattern>
    <g id="knot">
      <ellipse rx="13" ry="8" fill="none" stroke="#6e4423" stroke-width="1.3" opacity="0.7"/>
      <ellipse rx="7" ry="4.5" fill="none" stroke="#6e4423" stroke-width="1.2" opacity="0.7"/>
      <ellipse rx="2.5" ry="1.8" fill="#5c391c"/>
    </g>
    <pattern id="woodGrainV" href="#woodGrain" patternTransform="rotate(90)"/>
    <filter id="woodShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#woodShadow)">
    <polygon points="28,28 412,28 362,78 78,78" fill="url(#woodGrain)"/>
    <polygon points="28,512 412,512 362,462 78,462" fill="url(#woodGrain)"/>
    <polygon points="28,28 78,78 78,462 28,512" fill="url(#woodGrainV)"/>
    <polygon points="412,28 412,512 362,462 362,78" fill="url(#woodGrainV)"/>
    <use href="#knot" transform="translate(53,250)"/>
    <use href="#knot" transform="translate(220,487) rotate(90)"/>
  </g>

  <!-- miter seams -->
  <line x1="28" y1="28" x2="78" y2="78" stroke="#5c391c" stroke-width="1.5" opacity="0.7"/>
  <line x1="412" y1="28" x2="362" y2="78" stroke="#5c391c" stroke-width="1.5" opacity="0.7"/>
  <line x1="28" y1="512" x2="78" y2="462" stroke="#5c391c" stroke-width="1.5" opacity="0.7"/>
  <line x1="412" y1="512" x2="362" y2="462" stroke="#5c391c" stroke-width="1.5" opacity="0.7"/>

  <!-- outer edge -->
  <polygon points="28,28 412,28 412,512 28,512" fill="none" stroke="#5c391c" stroke-width="2"/>
  <!-- inner bevel highlight -->
  <rect x="78" y="78" width="284" height="384" fill="none" stroke="#d9a879" stroke-width="2"/>
  <!-- inner dark edge against window -->
  <rect x="76" y="76" width="288" height="388" fill="none" stroke="#5c391c" stroke-width="2"/>
</svg>
