<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 500">
  <defs>
    <mask id="polaroidMask">
      <rect x="0" y="0" width="440" height="500" fill="white"/>
      <rect x="50" y="50" width="340" height="300" fill="black"/>
    </mask>
    <filter id="dropshadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#dropshadow)">
    <rect x="20" y="20" width="400" height="460" rx="4" fill="#fbfbf8" mask="url(#polaroidMask)"/>
  </g>

  <rect x="20" y="20" width="400" height="460" rx="4" fill="none" stroke="#e5e1d8" stroke-width="1.5"/>
  <rect x="50" y="50" width="340" height="300" fill="none" stroke="#d8d3c5" stroke-width="1.5"/>
</svg>
